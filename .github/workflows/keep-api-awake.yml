name: keep-api-awake
# Render Free sleeps after ~15 idle minutes and the next request waits ~1 min
# while it boots. Two offset schedules: GitHub often runs scheduled jobs late,
# so one every 10 min left gaps of 20+ min. (One service all month stays
# inside the free 750 hours.)
on:
  schedule:
    - cron: '*/10 * * * *'
    - cron: '5-59/10 * * * *'
  workflow_dispatch:
jobs:
  ping:
    runs-on: ubuntu-latest
    timeout-minutes: 4
    steps:
      - name: Ping API health
        run: curl -fsS --retry 3 --retry-delay 20 --max-time 120 https://printlyapi.onrender.com/health
