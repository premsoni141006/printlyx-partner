name: keep-api-awake
# Render Free sleeps after ~15 idle minutes and the next request waits ~1 min
# while it boots. A light ping every 10 minutes keeps it warm (one service
# running all month stays inside the free 750 hours).
on:
  schedule:
    - cron: '*/10 * * * *'
  workflow_dispatch:
jobs:
  ping:
    runs-on: ubuntu-latest
    timeout-minutes: 4
    steps:
      - name: Ping API health
        run: curl -fsS --retry 3 --retry-delay 20 --max-time 120 https://printlyapi.onrender.com/health
